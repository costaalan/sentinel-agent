<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Agent — AIOps Multiagente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #08080e;
    --bg2: #0d0d1a;
    --bg3: #12122a;
    --border: rgba(99,102,241,0.12);
    --text: #e0e0e0;
    --text2: #888;
    --accent: #6366f1;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --blue: #3b82f6;
    --cyan: #06b6d4;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh; overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: 52px 1fr 200px;
    grid-template-areas:
        "header header"
        "graph  sidebar"
        "chat   sidebar";
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Header */
header {
    grid-area: header;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
}
header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
header h1 span { color: var(--accent); }
header .stats {
    display: flex; gap: 20px; font-size: 12px;
}
header .stats .stat { display: flex; align-items: center; gap: 6px; }
header .stats .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Graph Area */
#graph-area {
    grid-area: graph;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 30% 40%, #0a0a18 0%, #06060c 100%);
}
#infra-canvas {
    width: 100%; height: 100%;
}

/* Chat Log */
#chat-area {
    grid-area: chat;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    display: flex; flex-direction: column;
    overflow: hidden;
}
#chat-header {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
}
#chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.6;
}
.chat-msg {
    padding: 4px 0;
    border-bottom: 1px solid rgba(99,102,241,0.05);
    animation: fadeIn 0.3s ease;
}
.chat-msg .time { color: var(--text2); }
.chat-msg .from { font-weight: 500; }
.chat-msg .from.dash { color: var(--cyan); }
.chat-msg .from.jobs { color: var(--yellow); }
.chat-msg .from.super { color: var(--accent); }
.chat-msg .arrow { color: var(--text2); }
.chat-msg .content { color: var(--text); }

/* Sidebar */
#sidebar {
    grid-area: sidebar;
    border-left: 1px solid var(--border);
    background: var(--bg2);
    display: flex; flex-direction: column;
    overflow: hidden;
}
#sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
}
.tab-btn {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--text2);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.tab-btn:hover { color: var(--text); background: rgba(99,102,241,0.05); }
.tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

.tab-content { display: none; flex: 1; overflow-y: auto; padding: 12px 16px; }
.tab-content.active { display: block; }

/* Incident lists */
.incident-card {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    font-size: 12px;
}
.incident-card .title { font-weight: 500; margin-bottom: 4px; }
.incident-card .meta { font-size: 11px; color: var(--text2); }
.incident-card .status {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
}
.incident-card .status.resolved { background: rgba(34,197,94,0.15); color: var(--green); }
.incident-card .status.pending { background: rgba(234,179,8,0.15); color: var(--yellow); }
.incident-card .status.in-progress { background: rgba(59,130,246,0.15); color: var(--blue); }
.incident-card .actions { margin-top: 8px; display: flex; gap: 6px; }
.incident-card .actions button {
    padding: 4px 12px;
    border-radius: 6px;
    border: none;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-auth { background: rgba(34,197,94,0.2); color: var(--green); }
.btn-auth:hover { background: rgba(34,197,94,0.3); }
.btn-deny { background: rgba(239,68,68,0.2); color: var(--red); }
.btn-deny:hover { background: rgba(239,68,68,0.3); }
.btn-take { background: rgba(99,102,241,0.2); color: var(--accent); }
.btn-take:hover { background: rgba(99,102,241,0.3); }

/* Agent list */
.agent-node {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
    font-size: 12px;
}
.agent-dot {
    width: 10px; height: 10px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
}
.agent-name { font-weight: 500; flex: 1; }
.agent-status { font-size: 11px; }
.agent-status.idle { color: var(--text2); }
.agent-status.active { color: var(--green); }

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.pulse { animation: pulse 1.5s ease-in-out infinite; }
</style>
</head>
<body>

<header>
    <h1>⚡ <span>Sentinel</span> Agent</h1>
    <div class="stats">
        <span class="stat"><span class="dot" style="background:var(--green)" id="s-resolved">0</span> Resolvidos</span>
        <span class="stat"><span class="dot" style="background:var(--blue)" id="s-inprogress">0</span> Em andamento</span>
        <span class="stat"><span class="dot" style="background:var(--yellow)" id="s-pending">0</span> Pendentes</span>
        <span class="stat" style="font-size:11px;color:var(--text2)" id="s-agents">2 agentes</span>
    </div>
</header>

<!-- Graph -->
<div id="graph-area">
    <canvas id="infra-canvas"></canvas>
</div>

<!-- Chat -->
<div id="chat-area">
    <div id="chat-header">
        <span>📡 Conversa entre Agentes</span>
        <span id="chat-count" style="color:var(--text2)">0 mensagens</span>
    </div>
    <div id="chat-messages"></div>
</div>

<!-- Sidebar -->
<div id="sidebar">
    <div id="sidebar-tabs">
        <button class="tab-btn active" onclick="switchTab('incidentes',this)">📋 Incidentes</button>
        <button class="tab-btn" onclick="switchTab('agentes',this)">🤖 Agentes</button>
    </div>
    <div id="tab-incidentes" class="tab-content active"></div>
    <div id="tab-agentes" class="tab-content"></div>
</div>

<script>
// ================ WEBSOCKET ================
const ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');
ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    handleEvent(data);
};

function handleEvent(data) {
    const { evento, dados } = data;
    if (evento === 'agente_atuou') {
        updateStats();
    }
    if (evento === 'incidente_atualizado') {
        addChatMessage(dados);
        updateStats();
        updateIncidents();
    }
    if (evento === 'estado_inicial') {
        updateStats(dados);
        updateIncidents();
        updateAgents();
    }
}

// ================ CHAT LOG ================
let msgCount = 0;
function addChatMessage(msg) {
    const el = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'chat-msg';
    
    const fromClass = msg.agente === 'DashboardMonitor' ? 'dash' :
                      msg.agente === 'JobsMonitor' ? 'jobs' : 'super';
    
    div.innerHTML = `<span class="time">${new Date().toLocaleTimeString()}</span> ` +
        `<span class="from ${fromClass}">${msg.agente || 'Supervisor'}</span> ` +
        `<span class="arrow">→</span> ` +
        `<span class="content">${escapeHtml(msg.conteudo?.substring(0, 120) || '')}</span>`;
    
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    document.getElementById('chat-count').textContent = ++msgCount + ' mensagens';
}

// ================ GRAPH (Canvas) ================
const canvas = document.getElementById('infra-canvas');
const ctx = canvas.getContext('2d');

const COMPONENTS = [
    { id: 'api_gw', label: 'API Gateway', x: 0, y: 0, type: 'api', status: 'healthy' },
    { id: 'svc_a', label: 'Servico A', x: 0, y: 0, type: 'service', status: 'healthy' },
    { id: 'svc_b', label: 'Servico B', x: 0, y: 0, type: 'service', status: 'healthy' },
    { id: 'fila', label: 'Fila de Jobs', x: 0, y: 0, type: 'queue', status: 'healthy' },
    { id: 'job', label: 'Job Sync Vendas', x: 0, y: 0, type: 'job', status: 'healthy' },
    { id: 'ia', label: 'Agente IA', x: 0, y: 0, type: 'ai', status: 'healthy' },
    { id: 'dash', label: 'Dashboard', x: 0, y: 0, type: 'dashboard', status: 'healthy' },
];

const EDGES = [
    { from: 'api_gw', to: 'svc_a' }, { from: 'api_gw', to: 'svc_b' },
    { from: 'fila', to: 'job' }, { from: 'job', to: 'dash' },
    { from: 'api_gw', to: 'ia' }, { from: 'svc_a', to: 'fila' },
    { from: 'svc_b', to: 'fila' },
];

// Agent nodes for the graph overlay
const AGENT_NODES = [
    { id: 'supervisor', label: 'Supervisor', x: 0, y: 0, color: '#6366f1' },
    { id: 'dash_mon', label: 'Dashboard', x: 0, y: 0, color: '#06b6d4' },
    { id: 'jobs_mon', label: 'Jobs', x: 0, y: 0, color: '#eab308' },
];

let animTime = 0;
let graphNodes = [...COMPONENTS];
let agentPositions = [...AGENT_NODES];

function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    layoutNodes();
}
window.addEventListener('resize', resize);

function layoutNodes() {
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) * 0.3;
    
    // Component nodes in a circle
    const positions = [
        { x: cx, y: cy - r },           // api_gw top
        { x: cx - r*0.7, y: cy - r*0.4 }, // svc_a left-top
        { x: cx + r*0.7, y: cy - r*0.4 }, // svc_b right-top
        { x: cx - r*0.7, y: cy + r*0.3 }, // fila left-bottom
        { x: cx, y: cy + r*0.6 },        // job bottom
        { x: cx + r*0.7, y: cy + r*0.3 }, // ia right
        { x: cx, y: cy + r*0.9 },        // dash bottom
    ];
    
    COMPONENTS.forEach((c, i) => {
        if (i < positions.length) {
            c.x = positions[i].x;
            c.y = positions[i].y;
        }
    });
    
    // Agent nodes positioned around
    const agentR = r * 1.4;
    AGENT_NODES[0].x = cx; AGENT_NODES[0].y = cy - agentR;     // supervisor top
    AGENT_NODES[1].x = cx - agentR * 0.7; AGENT_NODES[1].y = cy + agentR * 0.5;  // dash-left
    AGENT_NODES[2].x = cx + agentR * 0.7; AGENT_NODES[2].y = cy + agentR * 0.5;  // jobs-right
}

function drawGraph() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height;
    
    // Draw agent connections (outer ring)
    ctx.strokeStyle = 'rgba(99,102,241,0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    AGENT_NODES.forEach(a => {
        COMPONENTS.forEach(c => {
            const dist = Math.hypot(a.x - c.x, a.y - c.y);
            if (dist < 300) {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(c.x, c.y);
                ctx.stroke();
            }
        });
    });
    ctx.setLineDash([]);
    
    // Draw edges between components
    EDGES.forEach(e => {
        const from = COMPONENTS.find(c => c.id === e.from);
        const to = COMPONENTS.find(c => c.id === e.to);
        if (!from || !to) return;
        
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.strokeStyle = 'rgba(99,102,241,0.15)';
        ctx.lineWidth = 1;
        ctx.stroke();
    });
    
    // Draw agent nodes
    AGENT_NODES.forEach(a => {
        const pulse = Math.sin(animTime * 2 + a.id.length) * 0.3 + 0.7;
        const r = 16;
        
        // Glow
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, r * 2);
        grad.addColorStop(0, a.color + '40');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(a.x, a.y, r * 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Circle
        ctx.beginPath();
        ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
        ctx.fillStyle = a.color + '30';
        ctx.strokeStyle = a.color;
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
        
        // Label
        ctx.fillStyle = a.color;
        ctx.font = '10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(a.label, a.x, a.y + r + 14);
    });
    
    // Draw component nodes
    COMPONENTS.forEach(c => {
        const pulse = Math.sin(animTime * 3 + COMPONENTS.indexOf(c)) * 0.15 + 0.85;
        const r = c.type === 'api' ? 22 : c.type === 'ai' ? 20 : 16;
        
        let color = 'rgba(34,197,94,0.8)';
        if (c.status === 'warning') color = 'rgba(234,179,8,0.8)';
        if (c.status === 'critical') color = 'rgba(239,68,68,0.8)';
        
        // Glow
        const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 2.5);
        grad.addColorStop(0, color.replace('0.8', '0.15'));
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r * 2.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Node
        ctx.beginPath();
        ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color.replace('0.8', '0.2');
        ctx.strokeStyle = color;
        ctx.lineWidth = 2 * pulse;
        ctx.fill();
        ctx.stroke();
        
        // Label
        ctx.fillStyle = '#ccc';
        ctx.font = '10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.label, c.x, c.y + r + 14);
    });
    
    // Agent communication particles
    const t = animTime;
    AGENT_NODES.forEach((a1, i) => {
        AGENT_NODES.forEach((a2, j) => {
            if (i >= j) return;
            const progress = (Math.sin(t * 0.5 + i * 2 + j * 3) + 1) / 2;
            const x = a1.x + (a2.x - a1.x) * progress;
            const y = a1.y + (a2.y - a1.y) * progress;
            
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(99,102,241,0.6)';
            ctx.fill();
        });
    });
    
    animTime += 0.02;
    requestAnimationFrame(drawGraph);
}

// ================ UI ================
function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}

function updateStats(state) {
    // Fetch from API if no state provided
    fetch('/api/estado').then(r => r.json()).then(data => {
        const s = data.supervisor || {};
        document.getElementById('s-resolved').textContent = s.resolvidos || 0;
        document.getElementById('s-inprogress').textContent = s.em_resolucao || 0;
        document.getElementById('s-pending').textContent = s.pendentes || 0;
    }).catch(() => {});
    
    if (state && state.agentes) {
        document.getElementById('s-agents').textContent = state.agentes.length + ' agentes';
    }
}

function updateIncidents() {
    fetch('/api/incidentes?limit=10').then(r => r.json()).then(data => {
        const el = document.getElementById('tab-incidentes');
        if (!data.incidentes || !data.incidentes.length) {
            el.innerHTML = '<div style="color:var(--text2);font-size:12px;padding:20px;text-align:center">Nenhum incidente ainda. Aguardando simulador...</div>';
            return;
        }
        el.innerHTML = data.incidentes.map(inc => {
            const statusClass = inc.ativo ? 'in-progress' : 'resolved';
            const statusLabel = inc.ativo ? 'Ativo' : 'Resolvido';
            return `<div class="incident-card">
                <div class="title">${escapeHtml(inc.nome)}</div>
                <div class="meta">${escapeHtml(inc.causa)}</div>
                <div style="margin-top:4px;display:flex;gap:8px;align-items:center">
                    <span class="status ${statusClass}">${statusLabel}</span>
                    <span style="font-size:10px;color:var(--text2)">${inc.componente}</span>
                </div>
            </div>`;
        }).join('');
    }).catch(() => {});
}

function updateAgents() {
    fetch('/api/agentes').then(r => r.json()).then(data => {
        const el = document.getElementById('tab-agentes');
        el.innerHTML = data.agentes.map(name => {
            const cls = name === 'DashboardMonitor' ? 'dash' : 'jobs';
            const color = cls === 'dash' ? '#06b6d4' : '#eab308';
            return `<div class="agent-node">
                <div class="agent-dot" style="color:${color}"></div>
                <span class="agent-name">${name}</span>
                <span class="agent-status active">🟢 ativo</span>
            </div>`;
        }).join('');
    }).catch(() => {});
}

// Init
resize();
drawGraph();

// Load initial data
setTimeout(() => {
    fetch('/api/incidentes?limit=5').then(r => r.json()).then(d => {
        if (d.incidentes) d.incidentes.forEach(i => {
            addChatMessage({
                agente: 'Sistema',
                conteudo: 'Incidente injetado: ' + i.nome + ' (' + i.causa.substring(0, 60) + ')'
            });
        });
    }).catch(() => {});
    updateStats();
    updateIncidents();
    updateAgents();
}, 1000);

// Periodic updates
setInterval(updateStats, 5000);
setInterval(updateIncidents, 5000);
</script>
</body>
</html>
